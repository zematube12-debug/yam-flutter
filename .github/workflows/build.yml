name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.yampicture --project-name yam_album ../tmp_app
          cp -r ../tmp_app/android ./android
          sed -i 's/android:label="[^"]*"/android:label="YAM Album"/' android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Build APK (32-bit + 64-bit)
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAM-Album-APK
          path: build/app/outputs/flutter-apk/app-release.apk
